name: Build RootBridge
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: doronz88/action-theos@master
      - name: Compile Package
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootbridge-deb
          path: packages/*.deb
